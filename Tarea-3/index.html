<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <div class="encabezado">
            <div>
                <h1>Lista de Tareas</h1>
                <p>Organiza tus actividades de manera sencilla</p>
            </div>

            <button id="modoOscuro">🌙</button>
        </div>

        <div class="formulario">

            <input
                type="text"
                id="nombreTarea"
                placeholder="Escribe una tarea..."
            >

            <input
                type="date"
                id="fechaTarea"
            >

            <select id="categoriaTarea">
                <option value="Escuela">Escuela</option>
                <option value="Trabajo">Trabajo</option>
                <option value="Personal">Personal</option>
            </select>

            <button id="agregarTarea">
                Agregar tarea
            </button>

        </div>

        <div class="filtros">

            <button class="filtro activo" data-categoria="Todas">
                Todas
            </button>

            <button class="filtro" data-categoria="Escuela">
                Escuela
            </button>

            <button class="filtro" data-categoria="Trabajo">
                Trabajo
            </button>

            <button class="filtro" data-categoria="Personal">
                Personal
            </button>

        </div>

        <div class="seccion">

            <div class="titulo">
                <h2>Mis tareas</h2>
                <span id="contador">0 tareas</span>
            </div>

            <div id="listaTareas"></div>

        </div>


        <div class="seccion">

            <h2>Próximas a vencer</h2>

            <div id="proximasTareas"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
