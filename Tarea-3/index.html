<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <section class="panel">

            <div class="encabezado">
                <div>
                    <h1>Mi Lista de Tareas</h1>
                    <p>Organiza tus actividades de manera sencilla.</p>
                </div>

                <button id="modo" class="modo">🌙</button>
            </div>

            <div class="formulario">

                <input
                    type="text"
                    id="textoTarea"
                    placeholder="Escribe una nueva tarea..."
                >

                <input
                    type="date"
                    id="fechaTarea"
                >

                <select id="categoriaTarea">
                    <option value="Escuela">Escuela</option>
                    <option value="Trabajo">Trabajo</option>
                    <option value="Personal">Personal</option>
                </select>

            </div>

            <button id="agregarTarea" class="boton-agregar">
                + Agregar tarea
            </button>

            <div class="filtros">

                <button class="filtro activo" data-filtro="Todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="Escuela">
                    Escuela
                </button>

                <button class="filtro" data-filtro="Trabajo">
                    Trabajo
                </button>

                <button class="filtro" data-filtro="Personal">
                    Personal
                </button>

            </div>

        </section>


        <section class="contenido">

            <div class="titulo-seccion">
                <h2>Mis tareas</h2>
                <span id="contador">0 tareas</span>
            </div>

            <div id="listaTareas"></div>


            <div class="proximas">

                <h2>Próximas a vencer</h2>

                <div id="listaProximas"></div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
