<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="panel-principal">

            <div class="encabezado">

                <div>
                    <p class="subtitulo">ORGANIZADOR PERSONAL</p>
                    <h1>Mi Lista de Tareas</h1>
                    <p class="descripcion">
                        Organiza tus pendientes y lleva el control de tus actividades.
                    </p>
                </div>

                <button id="botonModo" class="boton-modo" title="Cambiar modo">
                    🌙
                </button>

            </div>


            <div class="formulario">

                <div class="campo tarea-campo">
                    <label for="textoTarea">Nueva tarea</label>

                    <input
                        type="text"
                        id="textoTarea"
                        placeholder="Ej. Terminar tarea de programación"
                    >
                </div>


                <div class="campo">

                    <label for="fechaTarea">Fecha límite</label>

                    <input
                        type="date"
                        id="fechaTarea"
                    >

                </div>


                <div class="campo">

                    <label for="categoriaTarea">Categoría</label>

                    <select id="categoriaTarea">
                        <option value="Escuela">📚 Escuela</option>
                        <option value="Trabajo">💼 Trabajo</option>
                        <option value="Personal">🏠 Personal</option>
                    </select>

                </div>

            </div>


            <button id="agregarTarea" class="boton-agregar">
                ＋ Agregar nueva tarea
            </button>


            <div class="filtros">

                <span>Mostrar:</span>

                <button class="filtro activo" data-filtro="Todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="Escuela">
                    Escuela
                </button>

                <button class="filtro" data-filtro="Trabajo">
                    Trabajo
                </button>

                <button class="filtro" data-filtro="Personal">
                    Personal
                </button>

            </div>

        </section>


        <section class="resumen">

            <div class="tarjeta-resumen">
                <span class="icono-resumen">📋</span>

                <div>
                    <p>Total de tareas</p>
                    <strong id="totalTareas">0</strong>
                </div>
            </div>


            <div class="tarjeta-resumen">
                <span class="icono-resumen">⏰</span>

                <div>
                    <p>Próximas a vencer</p>
                    <strong id="totalProximas">0</strong>
                </div>
            </div>

        </section>


        <section class="seccion-tareas">

            <div class="titulo-seccion">
                <div>
                    <p class="subtitulo-seccion">TUS ACTIVIDADES</p>
                    <h2>Mis tareas</h2>
                </div>

                <span id="contador">0 tareas</span>
            </div>


            <div id="listaTareas" class="lista-tareas"></div>

        </section>


        <section class="seccion-proximas">

            <div class="titulo-seccion">
                <div>
                    <p class="subtitulo-seccion">RECORDATORIOS</p>
                    <h2>Próximas a vencer</h2>
                </div>
            </div>

            <div id="listaProximas"></div>

        </section>

    </main>

    <script>
// Luis Ricardo Delgado Sevilla

const textoTarea = document.getElementById("textoTarea");
const fechaTarea = document.getElementById("fechaTarea");
const categoriaTarea = document.getElementById("categoriaTarea");

const botonAgregar = document.getElementById("agregarTarea");
const botonModo = document.getElementById("botonModo");

const listaTareas = document.getElementById("listaTareas");
const listaProximas = document.getElementById("listaProximas");

const contador = document.getElementById("contador");
const totalTareas = document.getElementById("totalTareas");
const totalProximas = document.getElementById("totalProximas");

let tareas = JSON.parse(localStorage.getItem("tareasLuis")) || [];
let filtroActual = "Todas";


function guardarTareas() {
    localStorage.setItem("tareasLuis", JSON.stringify(tareas));
}


function agregarTarea() {

    const texto = textoTarea.value.trim();

    if (texto === "") {
        alert("Escribe una tarea.");
        return;
    }

    const nuevaTarea = {
        id: Date.now(),
        texto: texto,
        fecha: fechaTarea.value,
        categoria: categoriaTarea.value
    };

    tareas.push(nuevaTarea);

    guardarTareas();

    textoTarea.value = "";
    fechaTarea.value = "";

    mostrarTareas();
}


function mostrarTareas() {

    listaTareas.innerHTML = "";

    let filtradas = tareas;

    if (filtroActual !== "Todas") {
        filtradas = tareas.filter(
            tarea => tarea.categoria === filtroActual
        );
    }


    totalTareas.textContent = tareas.length;

    contador.textContent =
        tareas.length === 1
        ? "1 tarea"
        : tareas.length + " tareas";


    if (filtradas.length === 0) {

        listaTareas.innerHTML = `
            <div class="vacio">
                No hay tareas en esta categoría.
            </div>
        `;

    } else {

        filtradas.forEach(tarea => {

            const tarjeta = document.createElement("div");

            tarjeta.className = "tarea";

            const fecha =
                tarea.fecha
                ? formatearFecha(tarea.fecha)
                : "Sin fecha límite";


            tarjeta.innerHTML = `
                <div class="tarea-info">

                    <h3>${tarea.texto}</h3>

                    <div class="detalles-tarea">

                        <span class="fecha">
                            📅 ${fecha}
                        </span>

                        <span class="categoria ${tarea.categoria}">
                            ${tarea.categoria}
                        </span>

                    </div>

                </div>

                <div class="acciones">

                    <button
                        class="editar"
                        onclick="editarTarea(${tarea.id})">
                        ✏️ Editar
                    </button>

                    <button
                        class="eliminar"
                        onclick="eliminarTarea(${tarea.id}, this)">
                        🗑️ Eliminar
                    </button>

                </div>
            `;

            listaTareas.appendChild(tarjeta);
        });
    }

    mostrarProximas();
}


function editarTarea(id) {

    const tarea = tareas.find(
        tarea => tarea.id === id
    );

    if (!tarea) {
        return;
    }

    const nuevoTexto = prompt(
        "Edita la tarea:",
        tarea.texto
    );

    if (nuevoTexto === null) {
        return;
    }

    if (nuevoTexto.trim() === "") {
        alert("La tarea no puede estar vacía.");
        return;
    }

    tarea.texto = nuevoTexto.trim();

    guardarTareas();

    mostrarTareas();
}


function eliminarTarea(id, boton) {

    const tarjeta = boton.closest(".tarea");

    tarjeta.classList.add("eliminando");

    setTimeout(() => {

        tareas = tareas.filter(
            tarea => tarea.id !== id
        );

        guardarTareas();

        mostrarTareas();

    }, 350);
}


function mostrarProximas() {

    listaProximas.innerHTML = "";

    const hoy = new Date();

    hoy.setHours(0, 0, 0, 0);

    const proximas = tareas.filter(tarea => {

        if (!tarea.fecha) {
            return false;
        }

        const fecha = new Date(
            tarea.fecha + "T00:00:00"
        );

        const diferencia = fecha - hoy;

        const dias =
            diferencia / (1000 * 60 * 60 * 24);

        return dias >= 0 && dias <= 3;
    });


    totalProximas.textContent = proximas.length;


    if (proximas.length === 0) {

        listaProximas.innerHTML = `
            <div class="vacio">
                No tienes tareas próximas a vencer.
            </div>
        `;

        return;
    }


    proximas.forEach(tarea => {

        const tarjeta = document.createElement("div");

        tarjeta.className = "proxima";

        tarjeta.innerHTML = `
            <strong>
                ⏰ ${tarea.texto}
            </strong>

            <p>
                Vence el ${formatearFecha(tarea.fecha)}
                · ${tarea.categoria}
            </p>
        `;

        listaProximas.appendChild(tarjeta);
    });
}


function formatearFecha(fecha) {

    const partes = fecha.split("-");

    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}


document
.querySelectorAll(".filtro")
.forEach(boton => {

    boton.addEventListener("click", function() {

        document
        .querySelectorAll(".filtro")
        .forEach(b => {
            b.classList.remove("activo");
        });

        this.classList.add("activo");

        filtroActual = this.dataset.filtro;

        mostrarTareas();
    });
});


botonAgregar.addEventListener("click", agregarTarea);


textoTarea.addEventListener("keydown", function(evento) {

    if (evento.key === "Enter") {
        agregarTarea();
    }
});


botonModo.addEventListener("click", function() {

    document.body.classList.toggle("oscuro");

    const oscuro =
        document.body.classList.contains("oscuro");

    if (oscuro) {

        botonModo.textContent = "☀️";

    } else {

        botonModo.textContent = "🌙";

    }

    localStorage.setItem(
        "modoOscuroLuis",
        oscuro
    );
});


if (localStorage.getItem("modoOscuroLuis") === "true") {

    document.body.classList.add("oscuro");

    botonModo.textContent = "☀️";
}


mostrarTareas();

</script>

</body>
</html>

</body>
</html>
