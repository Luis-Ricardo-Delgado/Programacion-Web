<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="./style.css?v=2">
</head>
<body>

<main class="app">

    <section class="panel">
        <header>
            <div>
                <p class="subtitulo">ORGANIZADOR PERSONAL</p>
                <h1>Mi Lista de Tareas</h1>
                <p class="descripcion">Organiza tus pendientes y lleva el control de tus actividades.</p>
            </div>
            <button id="modo" class="modo">🌙</button>
        </header>

        <div class="formulario">
            <div class="campo">
                <label>Nueva tarea</label>
                <input type="text" id="texto" placeholder="Ej. Terminar tarea de programación">
            </div>

            <div class="campo">
                <label>Fecha límite</label>
                <input type="date" id="fecha">
            </div>

            <div class="campo">
                <label>Categoría</label>
                <select id="categoria">
                    <option value="Escuela">📚 Escuela</option>
                    <option value="Trabajo">💼 Trabajo</option>
                    <option value="Personal">🏠 Personal</option>
                </select>
            </div>
        </div>

        <button class="agregar" id="agregar">＋ Agregar nueva tarea</button>

        <div class="filtros">
            <span>Mostrar:</span>
            <button class="filtro activo" data-categoria="Todas">Todas</button>
            <button class="filtro" data-categoria="Escuela">Escuela</button>
            <button class="filtro" data-categoria="Trabajo">Trabajo</button>
            <button class="filtro" data-categoria="Personal">Personal</button>
        </div>
    </section>

    <section class="resumen">
        <div class="estadistica">
            <div class="icono">📋</div>
            <div>
                <p>Total de tareas</p>
                <strong id="total">0</strong>
            </div>
        </div>

        <div class="estadistica">
            <div class="icono">⏰</div>
            <div>
                <p>Próximas a vencer</p>
                <strong id="totalProximas">0</strong>
            </div>
        </div>
    </section>

    <section class="panel">
        <div class="encabezado">
            <div>
                <p class="subtitulo">TUS ACTIVIDADES</p>
                <h2>Mis tareas</h2>
            </div>
            <span id="contador"></span>
        </div>

        <div id="lista"></div>
    </section>

    <section class="panel">
        <p class="subtitulo">RECORDATORIOS</p>
        <h2>Próximas a vencer</h2>
        <div id="proximas"></div>
    </section>

    <footer>
        Desarrollado por Luis Ricardo Delgado Sevilla
    </footer>

</main>

<script>
const texto = document.getElementById("texto");
const fecha = document.getElementById("fecha");
const categoria = document.getElementById("categoria");
const lista = document.getElementById("lista");
const proximas = document.getElementById("proximas");
const modo = document.getElementById("modo");

let tareas = JSON.parse(localStorage.getItem("tareasLuis")) || [];
let filtro = "Todas";

function guardar() {
    localStorage.setItem("tareasLuis", JSON.stringify(tareas));
}

function agregar() {
    if (!texto.value.trim()) {
        alert("Escribe una tarea.");
        return;
    }

    tareas.push({
        id: Date.now(),
        texto: texto.value.trim(),
        fecha: fecha.value,
        categoria: categoria.value
    });

    guardar();

    texto.value = "";
    fecha.value = "";

    mostrar();
}

function formatearFecha(valor) {
    if (!valor) return "Sin fecha límite";
    return valor.split("-").reverse().join("/");
}

function escapar(valor) {
    const elemento = document.createElement("span");
    elemento.textContent = valor;
    return elemento.innerHTML;
}

function mostrar() {
    lista.innerHTML = "";

    const filtradas = filtro === "Todas"
        ? tareas
        : tareas.filter(t => t.categoria === filtro);

    document.getElementById("total").textContent = tareas.length;

    document.getElementById("contador").textContent =
        filtradas.length + (filtradas.length === 1 ? " tarea" : " tareas");

    if (filtradas.length === 0) {
        lista.innerHTML = '<div class="vacio">No hay tareas en esta categoría.</div>';
    }

    filtradas.forEach(tarea => {
        const tarjeta = document.createElement("div");

        tarjeta.className = "tarea";

        tarjeta.innerHTML = `
            <div class="informacion">
                <h3>${escapar(tarea.texto)}</h3>
                <div class="detalles">
                    <span>📅 ${formatearFecha(tarea.fecha)}</span>
                    <span class="categoria ${tarea.categoria}">
                        ${tarea.categoria}
                    </span>
                </div>
            </div>

            <div class="acciones">
                <button class="editar" onclick="editar(${tarea.id})">
                    ✏️ Editar
                </button>

                <button class="eliminar" onclick="eliminar(${tarea.id}, this)">
                    🗑️ Eliminar
                </button>
            </div>
        `;

        lista.appendChild(tarjeta);
    });

    mostrarProximas();
}

function editar(id) {
    const tarea = tareas.find(t => t.id === id);

    if (!tarea) return;

    const nuevoTexto = prompt("Edita tu tarea:", tarea.texto);

    if (nuevoTexto !== null && nuevoTexto.trim()) {
        tarea.texto = nuevoTexto.trim();
        guardar();
        mostrar();
    }
}

function eliminar(id, boton) {
    const tarjeta = boton.closest(".tarea");

    tarjeta.classList.add("eliminando");

    setTimeout(() => {
        tareas = tareas.filter(t => t.id !== id);
        guardar();
        mostrar();
    }, 350);
}

function mostrarProximas() {
    proximas.innerHTML = "";

    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);

    const limite = new Date(hoy);
    limite.setDate(limite.getDate() + 3);

    const pendientes = tareas.filter(tarea => {
        if (!tarea.fecha) return false;

        const vencimiento = new Date(tarea.fecha + "T00:00:00");

        return vencimiento >= hoy && vencimiento <= limite;
    });

    document.getElementById("totalProximas").textContent =
        pendientes.length;

    if (pendientes.length === 0) {
        proximas.innerHTML = '<div class="vacio">No tienes tareas próximas a vencer.</div>';
        return;
    }

    pendientes.forEach(tarea => {
        const tarjeta = document.createElement("div");

        tarjeta.className = "proxima";

        tarjeta.innerHTML = `
            <strong>⏰ ${escapar(tarea.texto)}</strong>
            <p>Vence el ${formatearFecha(tarea.fecha)} · ${tarea.categoria}</p>
        `;

        proximas.appendChild(tarjeta);
    });
}

document.querySelectorAll(".filtro").forEach(boton => {
    boton.addEventListener("click", () => {
        document.querySelectorAll(".filtro").forEach(b => {
            b.classList.remove("activo");
        });

        boton.classList.add("activo");
        filtro = boton.dataset.categoria;
        mostrar();
    });
});

document.getElementById("agregar").addEventListener("click", agregar);

texto.addEventListener("keydown", evento => {
    if (evento.key === "Enter") agregar();
});

modo.addEventListener("click", () => {
    document.body.classList.toggle("oscuro");

    const oscuro = document.body.classList.contains("oscuro");

    modo.textContent = oscuro ? "☀️" : "🌙";

    localStorage.setItem("modoOscuroLuis", oscuro);
});

if (localStorage.getItem("modoOscuroLuis") === "true") {
    document.body.classList.add("oscuro");
    modo.textContent = "☀️";
}

mostrar();
</script>

</body>
</html>
